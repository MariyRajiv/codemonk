{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <link rel="stylesheet" href="{% static 'search/password_reset.css' %}">
</head>
<body>

    <h2 style="text-align: center;">Password Reset</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% if not request.session.email_otp_sent %}
        <form action="{% url 'search:reset_password' %}" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit">Send OTP</button>
        </form>
    {% else %}
        <form action="{% url 'search:verify_otp' %}" method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button type="submit">Update Password</button>
        </form>
    {% endif %}

</body>
</html>

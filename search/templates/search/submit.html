{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Submit Paragraphs</title>
        <link rel="stylesheet" href={% static "search/submit_style.css" %}>
    </head>
    <body>
        <form method="post" action={% url "search:submit" %}>
            {% csrf_token %}
            <h1>Paragraphs Page</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>
        <a href="{% url 'search:dashboard' %}" class="back-btn">Back to DashBoard</a>
    </body>
</html>
